<title>Fila do Ponto Bizarro</title>

<!-- Ferramenta de operação: sumário do lote em cima, um cartão por vídeo embaixo,
     prévia vertical à esquerda e o texto que vai ao ar à direita. -->
<style>
  :root {
    /* Escuro por padrão: a revisão é de vídeo, e miniatura se julga melhor sobre
       fundo escuro. Neutros puxados para o azul-esverdeado do acento. */
    --fundo: #0e1214;
    --superficie: #161c1f;
    --superficie-alta: #1d2529;
    --borda: #2a353a;
    --texto: #e6ecee;
    --fraco: #8fa3aa;
    --acento: #3fa9a0;
    --ok: #5fa878;
    --atencao: #d79a3c;
    --erro: #cf6257;
    --display: "Instrument Serif", Georgia, "Times New Roman", serif;
    --corpo: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --dado: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --fundo: #f4f6f6;
      --superficie: #ffffff;
      --superficie-alta: #eef2f2;
      --borda: #d4dedf;
      --texto: #12191b;
      --fraco: #5a6b70;
      --acento: #1f7d76;
      --ok: #33724a;
      --atencao: #9a6a14;
      --erro: #a8392f;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --fundo: #f4f6f6;
    --superficie: #ffffff;
    --superficie-alta: #eef2f2;
    --borda: #d4dedf;
    --texto: #12191b;
    --fraco: #5a6b70;
    --acento: #1f7d76;
    --ok: #33724a;
    --atencao: #9a6a14;
    --erro: #a8392f;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--fundo);
    color: var(--texto);
    font-family: var(--corpo);
    font-size: 15px;
    line-height: 1.5;
    margin: 0;
  }
  .envoltorio { max-width: 980px; margin: 0 auto; padding-block: 28px 64px; padding-left: 16px; padding-right: 16px; }

  header h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 3rem);
    line-height: 1.05;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  .subtitulo { color: var(--fraco); margin: 0; }

  .resumo { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 0; }
  .tile {
    background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px;
    padding: 10px 14px; min-width: 0; flex: 1 1 140px;
  }
  .tile .n { font-family: var(--dado); font-size: 1.35rem; font-variant-numeric: tabular-nums; display: block; }
  .tile .r { color: var(--fraco); font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; }

  .semana { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 18px 0 0; }
  @media (max-width: 560px) { .semana { grid-template-columns: repeat(4, 1fr); } }
  .dia {
    background: var(--superficie); border: 1px solid var(--borda); border-radius: 9px;
    padding: 8px 6px; text-align: center; min-width: 0; text-decoration: none; color: inherit;
    display: flex; flex-direction: column; gap: 2px;
  }
  .dia .nome { font-size: .66rem; text-transform: uppercase; letter-spacing: .07em; color: var(--fraco); }
  .dia .num { font-family: var(--dado); font-size: .95rem; font-variant-numeric: tabular-nums; }
  .dia .hora { font-family: var(--dado); font-size: .68rem; color: var(--fraco); font-variant-numeric: tabular-nums; }
  .dia.cheio { border-color: var(--acento); }
  .dia.cheio .num { color: var(--acento); }
  .dia.vazio .num { color: var(--atencao); }
  .dia.fds { background: var(--superficie-alta); }
  a.dia:hover { border-color: var(--acento); }

  .lote { margin: 22px 0 0; border: 1px solid var(--borda); border-radius: 10px; overflow: hidden; }
  .lote h2 {
    margin: 0; padding: 10px 14px; font-size: .74rem; text-transform: uppercase; letter-spacing: .1em;
    color: var(--fraco); background: var(--superficie-alta); font-weight: 600; font-family: var(--corpo);
  }
  .lote ul { list-style: none; margin: 0; padding: 0; }
  .lote li { padding: 10px 14px; border-top: 1px solid var(--borda); display: flex; gap: 10px; align-items: flex-start; }
  .lote li:first-child { border-top: 0; }
  .lote .limpo { color: var(--ok); }

  .selo {
    font-family: var(--dado); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; flex: none;
  }
  .selo.vermelho { color: var(--erro); }
  .selo.amarelo { color: var(--atencao); }

  .cartao {
    margin-top: 18px; background: var(--superficie); border: 1px solid var(--borda);
    border-radius: 12px; overflow: hidden;
  }
  /* A faixa à esquerda carrega a decisão: dá para varrer a página e ver o que falta. */
  .cartao { border-left: 4px solid var(--borda); }
  .cartao[data-decisao="aprovado"] { border-left-color: var(--ok); }
  .cartao[data-decisao="ajustar"] { border-left-color: var(--atencao); }
  .cartao[data-decisao="recusado"] { border-left-color: var(--erro); }

  .cabeca { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; padding: 14px 16px 0; }
  .cabeca .num { font-family: var(--dado); color: var(--acento); font-size: 1rem; }
  .cabeca h3 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; margin: 0; flex: 1 1 200px; min-width: 0; }
  .cabeca .quando { font-family: var(--dado); font-size: .8rem; color: var(--fraco); font-variant-numeric: tabular-nums; }

  .corpo { display: grid; grid-template-columns: 200px 1fr; gap: 16px; padding: 14px 16px 16px; }
  @media (max-width: 640px) { .corpo { grid-template-columns: 1fr; } }
  .previa { min-width: 0; }
  .previa video, .previa img { width: 100%; max-width: 100%; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 8px; background: #000; display: block; }
  .medidas { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-family: var(--dado); font-size: .74rem; color: var(--fraco); font-variant-numeric: tabular-nums; }
  .texto { min-width: 0; display: flex; flex-direction: column; gap: 14px; }

  .bloco h4 {
    margin: 0 0 4px; font-size: .68rem; text-transform: uppercase; letter-spacing: .1em;
    color: var(--fraco); font-weight: 600;
  }
  .bloco p { margin: 0; white-space: pre-wrap; }
  .plataformas { display: grid; gap: 6px; }
  .plat { display: grid; grid-template-columns: 76px 52px 1fr; gap: 8px; align-items: baseline; }
  @media (max-width: 480px) { .plat { grid-template-columns: 1fr; gap: 0; } }
  .plat .nome { font-family: var(--dado); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--acento); }
  .plat .hora { font-family: var(--dado); font-size: .78rem; color: var(--fraco); font-variant-numeric: tabular-nums; }
  .plat .t { min-width: 0; }

  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tags span { font-family: var(--dado); font-size: .72rem; color: var(--fraco); background: var(--superficie-alta); border-radius: 5px; padding: 1px 6px; }

  .fontes { margin: 0; padding-left: 18px; color: var(--fraco); font-size: .86rem; }
  .fontes li { margin-bottom: 2px; }

  .decisao { border-top: 1px solid var(--borda); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    font-family: var(--corpo); font-size: .86rem; padding: 7px 14px; border-radius: 8px;
    border: 1px solid var(--borda); background: var(--superficie-alta); color: var(--texto); cursor: pointer;
  }
  button:hover { border-color: var(--acento); }
  button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  button[aria-pressed="true"] { color: var(--fundo); font-weight: 600; }
  button[data-v="aprovado"][aria-pressed="true"] { background: var(--ok); border-color: var(--ok); }
  button[data-v="ajustar"][aria-pressed="true"] { background: var(--atencao); border-color: var(--atencao); }
  button[data-v="recusado"][aria-pressed="true"] { background: var(--erro); border-color: var(--erro); }
  .decisao .estado { margin-left: auto; font-size: .8rem; color: var(--fraco); font-family: var(--dado); }

  .nota { padding: 0 16px 14px; }
  .nota textarea {
    width: 100%; min-height: 60px; resize: vertical; font-family: var(--corpo); font-size: .88rem;
    background: var(--fundo); color: var(--texto); border: 1px solid var(--borda); border-radius: 8px; padding: 8px 10px;
  }
  .nota textarea:focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; }
  .nota label { display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--fraco); margin-bottom: 4px; font-weight: 600; }

  .rodape { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--borda); color: var(--fraco); font-size: .86rem; }
  .aviso { background: var(--superficie); border: 1px solid var(--atencao); border-radius: 10px; padding: 12px 14px; margin-top: 18px; color: var(--texto); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap">

<div class="envoltorio">
  <header>
    <h1>Fila do Ponto Bizarro</h1>
    <p class="subtitulo" id="subtitulo">Carregando o lote…</p>
  </header>

  <div class="semana" id="semana"></div>
  <div class="resumo" id="resumo"></div>
  <div class="lote" id="lote" hidden></div>
  <div id="cartoes"></div>

  <div class="aviso" id="semBanco" hidden>
    As decisões não estão sendo guardadas nesta sessão — abra a página pela sua conta
    para que a aprovação fique registrada.
  </div>

  <p class="rodape" id="rodape"></p>
</div>

<script>
  const FILA = {"geradaEm":"2026-10-04T11:04:01.502Z","agenda":[{"data":"2026-10-05","diaDaSemana":"segunda","fimDeSemana":false,"horario":"12:30","numero":"0019"},{"data":"2026-10-06","diaDaSemana":"terça","fimDeSemana":false,"horario":"12:30","numero":null},{"data":"2026-10-07","diaDaSemana":"quarta","fimDeSemana":false,"horario":"12:30","numero":null},{"data":"2026-10-08","diaDaSemana":"quinta","fimDeSemana":false,"horario":"12:30","numero":null},{"data":"2026-10-09","diaDaSemana":"sexta","fimDeSemana":false,"horario":"12:30","numero":null},{"data":"2026-10-10","diaDaSemana":"sábado","fimDeSemana":true,"horario":"11:30","numero":null},{"data":"2026-10-11","diaDaSemana":"domingo","fimDeSemana":true,"horario":"11:30","numero":null}],"itens":[{"numero":"0019","titulo":"Você Não É Só Você","data":"2026-10-05","duracaoS":61.524,"planos":28,"aslS":2.1972857142857145,"plataformas":[{"plataforma":"youtube","horario":"12:30","titulo":"Tem células no seu corpo que não têm o seu DNA"},{"plataforma":"instagram","horario":"12:30","titulo":"Você carrega células de outra pessoa 🧬"},{"plataforma":"tiktok","horario":"12:30","titulo":"Parte do seu corpo não é sua e a ciência não sabe explicar"}],"legenda":"Na gravidez, células do bebê atravessam a placenta e ficam no corpo da mãe por décadas — inclusive no cérebro. E a via é de mão dupla: todo mundo carrega células da própria mãe. Chamam de microquimerismo. O que essas células fazem lá continua sem resposta: há evidência de que ajudam a reparar tecido, e evidência de que participam de doença autoimune.\n\n🎙️ Narração com voz sintética","hashtags":["#Mistério","#Curiosidades","#FatosBizarros","#PONTOBIZARRO","#Viral","#Ciência","#Biologia","#DNA","#CorpoHumano","#Genética","#Cérebro","#Saúde","#Descoberta"],"comentarioFixado":"As células da sua mãe ainda estão em você agora. Protegendo ou atacando? A ciência está dividida 👇","tagsYoutube":["microquimerismo","células fetais","dna","biologia","curiosidades","ciência","corpo humano"],"fontes":["Bianchi et al. (1996), PNAS — células fetais masculinas no sangue materno até 27 anos depois","Chan et al. (2012), PLoS ONE — microquimerismo masculino em 63% dos cérebros femininos analisados","Boddy et al. (2015), BioEssays — hipóteses de cooperação e conflito entre as células"],"assinaturas":{"gancho":"CP-04","virada":"TR-05","brilho":"FX-10","legenda":"TX-04","ganchoRoteiro":"GC-01","finalRoteiro":"EN-03"},"achados":[],"miniatura":"0019.jpg","previa":"0019.mp4"}],"achadosDoLote":[{"severidade":"amarelo","mensagem":"6 dia(s) sem vídeo: terça 06/10, quarta 07/10, quinta 08/10, sexta 09/10, sábado 10/10, domingo 11/10","videos":[]}]};
  const DECISOES = ["aprovado", "ajustar", "recusado"];
  const ROTULO = { aprovado: "Aprovar", ajustar: "Ajustar", recusado: "Recusar" };

  const el = (tag, cls, texto) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (texto !== undefined) n.textContent = texto;
    return n;
  };

  const seg = (s) => `${s.toFixed(1)}s`;

  /** Estado local das decisões; o banco, quando existe, manda. */
  const estado = new Map();
  let db = null;

  function pintarResumo() {
    const r = document.getElementById("resumo");
    r.replaceChildren();
    const decididos = FILA.itens.filter((i) => estado.get(i.numero)?.decisao).length;
    const aprovados = FILA.itens.filter((i) => estado.get(i.numero)?.decisao === "aprovado").length;
    const vermelhos = FILA.achadosDoLote.filter((a) => a.severidade === "vermelho").length;
    const tiles = [
      [String(FILA.itens.length), "vídeos no lote"],
      [`${aprovados}/${FILA.itens.length}`, "aprovados"],
      [`${decididos}/${FILA.itens.length}`, "decididos"],
      [String((FILA.agenda ?? []).filter((d) => d.numero === null).length), "dias sem vídeo"],
      [String(vermelhos), "achados do lote"],
    ];
    for (const [n, rot] of tiles) {
      const t = el("div", "tile");
      t.append(el("span", "n", n), el("span", "r", rot));
      r.append(t);
    }
  }

  function pintarSemana() {
    const box = document.getElementById("semana");
    box.replaceChildren();
    for (const d of FILA.agenda ?? []) {
      // Dia com vídeo é âncora para o cartão; dia vazio não leva a lugar nenhum.
      const cel = d.numero ? document.createElement("a") : document.createElement("div");
      cel.className = `dia ${d.numero ? "cheio" : "vazio"}${d.fimDeSemana ? " fds" : ""}`;
      if (d.numero) cel.href = `#v${d.numero}`;
      cel.append(
        el("span", "nome", d.diaDaSemana.slice(0, 3)),
        el("span", "num", d.numero ?? "—"),
        el("span", "hora", d.horario),
      );
      cel.title = `${d.diaDaSemana} ${d.data} às ${d.horario}`;
      box.append(cel);
    }
  }

  function pintarLote() {
    const box = document.getElementById("lote");
    box.hidden = false;
    box.replaceChildren();
    box.append(el("h2", null, "Conferências do lote"));
    const ul = el("ul");
    if (FILA.achadosDoLote.length === 0) {
      const li = el("li");
      li.append(el("span", "limpo", "Nada. Os vídeos não se repetem nem se atropelam."));
      ul.append(li);
    } else {
      for (const a of FILA.achadosDoLote) {
        const li = el("li");
        li.append(el("span", `selo ${a.severidade}`, a.severidade));
        const t = el("span", null, `${a.mensagem} — ${a.videos.join(", ")}`);
        li.append(t);
        ul.append(li);
      }
    }
    box.append(ul);
  }

  function cartao(item) {
    const c = el("article", "cartao");
    c.id = `v${item.numero}`;
    c.dataset.decisao = estado.get(item.numero)?.decisao ?? "";

    const cab = el("div", "cabeca");
    cab.append(el("span", "num", item.numero), el("h3", null, item.titulo));
    cab.append(el("span", "quando", item.data));
    c.append(cab);

    const corpo = el("div", "corpo");

    const previa = el("div", "previa");
    if (item.previa) {
      const v = document.createElement("video");
      v.src = item.previa;
      v.controls = true;
      v.preload = "none";
      if (item.miniatura) v.poster = item.miniatura;
      previa.append(v);
    } else if (item.miniatura) {
      const img = document.createElement("img");
      img.src = item.miniatura;
      img.alt = `Quadro de abertura do vídeo ${item.numero}`;
      previa.append(img);
    } else {
      previa.append(el("p", "medidas", "sem prévia renderizada"));
    }
    const med = el("div", "medidas");
    med.append(
      el("span", null, seg(item.duracaoS)),
      el("span", null, `${item.planos} planos`),
      el("span", null, `ASL ${seg(item.aslS)}`),
    );
    previa.append(med);
    corpo.append(previa);

    const texto = el("div", "texto");

    const bp = el("div", "bloco");
    bp.append(el("h4", null, "Títulos e horários"));
    const grade = el("div", "plataformas");
    for (const p of item.plataformas) {
      const linha = el("div", "plat");
      linha.append(el("span", "nome", p.plataforma), el("span", "hora", p.horario), el("span", "t", p.titulo));
      grade.append(linha);
    }
    bp.append(grade);
    texto.append(bp);

    const bl = el("div", "bloco");
    bl.append(el("h4", null, "Legenda"), el("p", null, item.legenda));
    texto.append(bl);

    const bc = el("div", "bloco");
    bc.append(el("h4", null, "Comentário fixado"), el("p", null, item.comentarioFixado));
    texto.append(bc);

    const bh = el("div", "bloco");
    bh.append(el("h4", null, `Hashtags (${item.hashtags.length})`));
    const tags = el("div", "tags");
    for (const h of item.hashtags) tags.append(el("span", null, h));
    bh.append(tags);
    texto.append(bh);

    if (item.tagsYoutube.length) {
      const bt = el("div", "bloco");
      bt.append(el("h4", null, "Tags do YouTube"));
      const tags2 = el("div", "tags");
      for (const h of item.tagsYoutube) tags2.append(el("span", null, h));
      bt.append(tags2);
      texto.append(bt);
    }

    if (item.fontes.length) {
      const bf = el("div", "bloco");
      bf.append(el("h4", null, "Fontes (§R6)"));
      const ul = el("ul", "fontes");
      for (const f of item.fontes) ul.append(el("li", null, f));
      bf.append(ul);
      texto.append(bf);
    }

    if (item.achados.length) {
      const ba = el("div", "bloco");
      ba.append(el("h4", null, "Achados do validador"));
      const ul = el("ul", "fontes");
      for (const a of item.achados) ul.append(el("li", null, `${a.regra} — ${a.mensagem}`));
      ba.append(ul);
      texto.append(ba);
    }

    corpo.append(texto);
    c.append(corpo);

    const dec = el("div", "decisao");
    for (const d of DECISOES) {
      const b = el("button", null, ROTULO[d]);
      b.dataset.v = d;
      b.setAttribute("aria-pressed", String(estado.get(item.numero)?.decisao === d));
      b.addEventListener("click", () => decidir(item.numero, d));
      dec.append(b);
    }
    const est = el("span", "estado", "");
    est.id = `estado-${item.numero}`;
    dec.append(est);
    c.append(dec);

    const nota = el("div", "nota");
    const lab = el("label", null, "Observação para mim");
    lab.htmlFor = `nota-${item.numero}`;
    const ta = document.createElement("textarea");
    ta.id = `nota-${item.numero}`;
    ta.value = estado.get(item.numero)?.nota ?? "";
    ta.placeholder = "O que mudar antes de publicar";
    let tempo;
    ta.addEventListener("input", () => {
      clearTimeout(tempo);
      tempo = setTimeout(() => guardar(item.numero, { nota: ta.value }), 600);
    });
    nota.append(lab, ta);
    c.append(nota);

    return c;
  }

  function pintarCartoes() {
    const box = document.getElementById("cartoes");
    box.replaceChildren(...FILA.itens.map(cartao));
    for (const i of FILA.itens) marcarEstado(i.numero);
  }

  function marcarEstado(numero) {
    const e = estado.get(numero);
    const cart = document.getElementById(`v${numero}`);
    if (cart) cart.dataset.decisao = e?.decisao ?? "";
    const span = document.getElementById(`estado-${numero}`);
    if (span) span.textContent = e?.decisao ? `${e.decisao} · ${new Date(e.em).toLocaleString("pt-BR")}` : "sem decisão";
    const botoes = cart ? cart.querySelectorAll("button[data-v]") : [];
    for (const b of botoes) b.setAttribute("aria-pressed", String(b.dataset.v === e?.decisao));
  }

  async function guardar(numero, patch) {
    const antes = estado.get(numero) ?? {};
    const depois = { ...antes, ...patch, em: new Date().toISOString() };
    estado.set(numero, depois);
    marcarEstado(numero);
    pintarResumo();
    if (!db) return;
    try {
      await db.doc(`aprovacoes/${numero}`).set(depois);
    } catch (e) {
      document.getElementById("semBanco").hidden = false;
    }
  }

  function decidir(numero, d) {
    const atual = estado.get(numero)?.decisao;
    guardar(numero, { decisao: atual === d ? "" : d });
  }

  function rodape() {
    const gerada = FILA.geradaEm ? new Date(FILA.geradaEm).toLocaleString("pt-BR") : "";
    document.getElementById("rodape").textContent =
      `Lote montado em ${gerada}. A prévia é 360p; a entrega vai em 1080×1920 com no máximo 20 MB (§V8). ` +
      `A decisão marcada aqui é o que autoriza a publicação.`;
  }

  // Primeiro quadro sem esperar o banco: a página já serve para ler o lote.
  {
    const ag = FILA.agenda ?? [];
    const janela = ag.length ? `Semana de ${ag[0].data} a ${ag[ag.length - 1].data}. ` : "";
    document.getElementById("subtitulo").textContent =
      `${janela}${FILA.itens.length} de ${ag.length || FILA.itens.length} dias com vídeo. ` +
      `Aprove um por um; o que ficar aprovado vai ao ar no horário do dia.`;
  }
  pintarSemana();
  pintarResumo();
  pintarLote();
  pintarCartoes();
  rodape();

  (async () => {
    db = await window.claude?.use?.("db");
    if (!db) {
      document.getElementById("semBanco").hidden = false;
      return;
    }
    db.collection("aprovacoes").onSnapshot((snap) => {
      for (const d of snap.docs) {
        if (!d.exists) continue;
        estado.set(d.id, d.data() ?? {});
        marcarEstado(d.id);
      }
      pintarResumo();
      for (const i of FILA.itens) {
        const ta = document.getElementById(`nota-${i.numero}`);
        const n = estado.get(i.numero)?.nota ?? "";
        if (ta && document.activeElement !== ta && ta.value !== n) ta.value = n;
      }
    });
  })();
</script>
